<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>測試環境 Portal</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1d2430; --muted:#6b7280; --line:#e5e7eb;
          --accent:#2563eb; --ok:#15803d; --warn:#b45309; --bad:#b91c1c; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Microsoft JhengHei", "PingFang TC", sans-serif;
         background:var(--bg); color:var(--fg); }
  header { display:flex; gap:12px; align-items:center; justify-content:space-between;
           padding:12px 20px; background:var(--card); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; }
  main { max-width:1000px; margin:0 auto; padding:16px; display:grid; gap:16px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; }
  h2 { font-size:16px; margin:0 0 12px; }
  .muted { color:var(--muted); font-size:13px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  select, input, button { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  button { background:var(--accent); color:#fff; border-color:var(--accent); cursor:pointer; }
  button.secondary { background:#fff; color:var(--fg); border-color:var(--line); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  .table-wrap { overflow-x:auto; }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; border:1px solid currentColor; }
  .s-ready, .s-running, .open { color:var(--ok); }
  .s-starting { color:var(--warn); }
  .s-failed, .closed { color:var(--bad); }
  .s-released, .s-stopped { color:var(--muted); }
  #msg { min-height:20px; }
  .err { color:var(--bad); }
  .hidden { display:none !important; }
  label.chk { display:inline-flex; gap:4px; align-items:center; font-size:14px; }
</style>
</head>
<body>
<header>
  <h1>測試環境 Portal</h1>
  <div class="row">
    <span id="who" class="muted"></span>
    <select id="devUser" class="hidden" title="開發模式：切換身分"></select>
  </div>
</header>
<main>
  <section id="requestSection" class="hidden">
    <h2>申請使用權限</h2>
    <p id="reqStatus" class="muted"></p>
    <div id="reqForm" class="hidden">
      <div class="row">
        <label>角色 <select id="reqRole"></select></label>
        <span>銀行</span><span id="reqBanks" class="row"></span>
      </div>
      <div class="row" style="margin-top:8px">
        <input id="reqReason" placeholder="申請原因（必填，例如：負責示範銀行 A 的測試）" style="flex:1;min-width:240px">
        <button id="reqBtn">送出申請</button>
      </div>
    </div>
    <div id="reqMsg" class="muted" style="margin-top:8px"></div>
  </section>

  <div id="appBody" class="hidden" style="display:contents">
  <section>
    <h2>開放時段</h2>
    <div id="window"></div>
    <div id="extendBox" class="row hidden" style="margin-top:10px">
      <span>延長今天到</span>
      <input id="extUntil" type="time" value="19:00">
      <input id="extReason" placeholder="原因（必填）" style="flex:1;min-width:180px">
      <button id="extBtn" class="secondary">延長</button>
    </div>
  </section>

  <section>
    <h2>喚醒測試環境</h2>
    <div class="row">
      <select id="bank"></select>
      <select id="kind"><option value="client">Client</option></select>
      <button id="wakeBtn">喚醒並連線</button>
    </div>
    <div id="msg" class="muted" style="margin-top:8px"></div>
  </section>

  <section>
    <h2>我的分配</h2>
    <div class="table-wrap"><table id="mine"></table></div>
  </section>

  <section id="opsSection" class="hidden">
    <h2>VM 狀態</h2>
    <div class="table-wrap"><table id="vms"></table></div>
    <h2 style="margin-top:16px">全部分配紀錄</h2>
    <div class="table-wrap"><table id="allAllocs"></table></div>
  </section>

  <section id="saSection" class="hidden">
    <h2>預暖機設定（SA）</h2>
    <div class="row">
      <label><input id="pwEnabled" type="checkbox"> 啟用</label>
      <label>待命 client <input id="pwStandby" type="number" min="0" style="width:70px"></label>
      <label>時段 <input id="pwStart" type="time"> – <input id="pwEnd" type="time"></label>
      <label>開機上限 <input id="pwMax" type="number" min="1" style="width:70px"></label>
      <button id="pwSave" class="secondary">儲存</button>
      <button id="reconcileBtn" class="secondary">立即 reconcile</button>
    </div>
    <h2 style="margin-top:16px">稽核紀錄</h2>
    <div class="table-wrap"><table id="audit"></table></div>
  </section>

  <section id="provSection" class="hidden">
    <h2>新增主機（SA）</h2>
    <div class="muted" id="provHint"></div>
    <div class="row" style="margin-top:8px">
      <input id="pvName" placeholder="名稱，例如 cli-03" style="width:160px">
      <select id="pvKind"><option value="client">Client</option><option value="server">Server</option></select>
      <select id="pvBank"></select>
      <span id="pvNewBank" class="hidden">
        <input id="pvBankId" placeholder="銀行代碼，例如 demo-c" style="width:150px">
        <input id="pvBankName" placeholder="銀行名稱" style="width:140px">
      </span>
      <input id="pvPorts" placeholder="檢查的 port，例如 3389,8080" value="3389" style="width:180px">
      <button id="pvBtn">建立</button>
    </div>
    <div id="pvMsg" class="muted" style="margin-top:8px"></div>
    <div class="table-wrap" style="margin-top:8px"><table id="pvJobs"></table></div>
  </section>

  <section id="usersSection" class="hidden">
    <h2>待審核的權限申請（SA）</h2>
    <div class="table-wrap"><table id="requests"></table></div>

    <h2 style="margin-top:16px">使用者管理（SA）</h2>
    <div id="cfSync" class="row muted" style="margin-bottom:8px"></div>
    <div class="table-wrap"><table id="users"></table></div>
    <h2 style="margin-top:16px">新增使用者</h2>
    <div class="row">
      <input id="nuEmail" placeholder="email" style="min-width:220px">
      <select id="nuRole"></select>
      <span id="nuBanks" class="row"></span>
      <button id="nuBtn" class="secondary">新增</button>
    </div>
  </section>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let me = null;
const asParam = new URLSearchParams(location.search).get("as");
const devUser = () => { if (asParam) return asParam; try { return localStorage.getItem("devUser"); } catch { return null; } };

async function api(path, opts = {}) {
  const headers = { "Content-Type": "application/json" };
  const du = devUser();
  if (du && me?.auth_mode !== "cloudflare") headers["X-Dev-User"] = du;
  const res = await fetch(path, { ...opts, headers: { ...headers, ...(opts.headers || {}) } });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || data.detail || res.statusText);
  return data;
}
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const pill = (s) => `<span class="pill s-${esc(s)}">${esc(s)}</span>`;
const t = (iso) => iso ? iso.replace("T", " ").slice(0, 16) : "";
const bankName = (id) => (me?.banks.find(b => b.id === id) || {}).name || id;

function table(el, cols, rows) {
  if (!rows.length) { el.innerHTML = `<tr><td class="muted">沒有資料</td></tr>`; return; }
  el.innerHTML = `<tr>${cols.map(c => `<th>${c[0]}</th>`).join("")}</tr>` +
    rows.map(r => `<tr>${cols.map(c => `<td>${c[1](r)}</td>`).join("")}</tr>`).join("");
}

function allocActions(a) {
  let h = "";
  if (a.status === "ready" && a.rdp_password) {
    pwById[a.id] = a.rdp_password;
    h += `帳號 <code>${esc(a.rdp_user || "")}</code> 密碼 <code>${esc(a.rdp_password)}</code> <button class="secondary" onclick="copyPw(${a.id})">複製密碼</button> `;
  }
  if (a.status === "ready" && a.rdp_url) h += `<a href="${esc(a.rdp_url)}" target="_blank" rel="noopener" onclick="copyPw(${a.id})">開啟遠端桌面</a> `;
  if (a.status === "starting" || a.status === "ready") h += `<button class="secondary" onclick="release(${a.id})">釋放</button>`;
  if ((a.status === "failed" || a.status === "starting") && a.note) h += `<span class="muted">${esc(a.note)}</span>`;
  return h;
}

async function loadMe() {
  me = await api("/api/me");
  $("who").textContent = `${me.email}（${me.role}）`;
  const w = me.window;
  $("window").innerHTML = `<span class="pill ${w.is_open ? "open" : "closed"}">${w.is_open ? "開放中" : "未開放"}</span> ` +
    `${esc(w.reason)} <span class="muted">平日 ${esc(w.open || "")}–${esc(w.close || "")}` +
    `${w.extended_until ? `，今日延長到 ${esc(w.extended_until)}` : ""}</span>`;
  $("extendBox").classList.toggle("hidden", !me.can_extend);
  $("extUntil").max = w.extend_max_until;
  $("bank").innerHTML = me.banks.map(b => `<option value="${esc(b.id)}">${esc(b.name)}</option>`).join("");
  $("kind").innerHTML = `<option value="client">Client</option>` + (me.can_server ? `<option value="server">Server</option>` : "");
  $("wakeBtn").disabled = !w.is_open || !me.banks.length;
  $("opsSection").classList.toggle("hidden", !me.can_server);
  $("saSection").classList.toggle("hidden", !me.is_sa);
  $("usersSection").classList.toggle("hidden", !me.is_sa);
  $("nuRole").innerHTML = ROLES.map(r => `<option>${r}</option>`).join("");
  $("nuBanks").innerHTML = bankChecks("nu", []);
  if (me.dev_users) {
    const sel = $("devUser");
    sel.classList.remove("hidden");
    sel.innerHTML = me.dev_users.map(u => `<option value="${esc(u.email)}">${esc(u.email)}（${esc(u.role)}）</option>`).join("");
    sel.value = me.email;
  }
}

async function refresh() {
  try {
    const mine = await api("/api/allocations");
    table($("mine"), [
      ["#", a => a.id], ["銀行", a => esc(bankName(a.bank))], ["VM", a => esc(a.vm)],
      ["狀態", a => pill(a.status)], ["開始", a => t(a.created_at)], ["", allocActions],
    ], mine.slice(0, 20));
    if (me.can_server) {
      table($("vms"), [
        ["VM", v => esc(v.name)], ["類型", v => v.kind], ["銀行", v => esc(v.bank ? bankName(v.bank) : "共用")],
        ["電源", v => pill(v.power)], ["使用中", v => esc(v.users.join(", "))],
      ], await api("/api/vms"));
      table($("allAllocs"), [
        ["#", a => a.id], ["誰", a => esc(a.email)], ["銀行", a => esc(bankName(a.bank))], ["VM", a => esc(a.vm)],
        ["狀態", a => pill(a.status)], ["開始", a => t(a.created_at)], ["結束", a => t(a.ended_at)],
      ], await api("/api/allocations?all=true"));
    }
    if (me.is_sa) {
      table($("audit"), [
        ["時間", r => t(r.ts)], ["誰", r => esc(r.email)], ["動作", r => esc(r.action)], ["內容", r => `<code>${esc(r.detail)}</code>`],
      ], (await api("/api/audit")).slice(0, 50));
      await loadProvision();
    }
  } catch (e) { $("msg").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
}

const ROLES = ["PM", "SE", "PG", "SA"];
let allBanks = [];
const roleSelect = (id, v) => `<select id="${id}">${ROLES.map(r => `<option ${r === v ? "selected" : ""}>${r}</option>`).join("")}</select>`;
const bankChecks = (prefix, chosen, withAll = true) =>
  (withAll ? [{ id: "*", name: "全部" }] : []).concat(allBanks).map(b =>
    `<label class="chk"><input type="checkbox" data-g="${prefix}" value="${esc(b.id)}" ${chosen.includes(b.id) ? "checked" : ""}>${esc(b.name)}</label>`).join(" ");
const checked = (prefix) => [...document.querySelectorAll(`input[data-g="${prefix}"]:checked`)].map(i => i.value);
const slug = (email) => email.replace(/[^a-z0-9]/gi, "_");

function syncText(r) {
  if (!r || r.skipped) return "";
  return r.ok ? `已同步 Cloudflare（${r.users} 人 / server ${r.server} 人）` : `Cloudflare 同步失敗：${r.error}`;
}

async function loadUsers() {
  if (!me.is_sa) return;
  const [users, reqs, sync] = await Promise.all([api("/api/users"), api("/api/access-requests?status=pending"), api("/api/cf-sync")]);
  $("cfSync").innerHTML = sync.enabled
    ? `<span>Cloudflare Access 同步：${esc(sync.last ? syncText(sync.last) + "，" + t(sync.last.at) : "尚未同步")}</span> <button class="secondary" onclick="syncNow()">立即同步</button>`
    : `<span>Cloudflare Access 同步未啟用（設定檔 [cloudflare_sync]）</span>`;
  table($("users"), [
    ["email", u => esc(u.email)],
    ["角色", u => roleSelect(`r_${slug(u.email)}`, u.role)],
    ["銀行", u => bankChecks(`b_${slug(u.email)}`, u.banks)],
    ["啟用", u => `<input type="checkbox" id="e_${slug(u.email)}" ${u.enabled ? "checked" : ""}>`],
    ["", u => `<button class="secondary" onclick='saveUser(${JSON.stringify(u.email)})'>儲存</button> <button class="secondary" onclick='deleteUser(${JSON.stringify(u.email)})'>刪除</button>`],
  ], users);
  table($("requests"), [
    ["#", r => r.id], ["email", r => esc(r.email)], ["申請時間", r => t(r.created_at)],
    ["角色", r => roleSelect(`qr_${r.id}`, r.role)],
    ["銀行", r => bankChecks(`qb_${r.id}`, r.banks)],
    ["原因", r => esc(r.reason)],
    ["", r => `<button onclick="decide(${r.id}, true)">核准</button> <button class="secondary" onclick="decide(${r.id}, false)">拒絕</button>`],
  ], reqs);
}

async function withMsg(fn) {
  try { const r = await fn(); $("msg").textContent = r || "完成"; }
  catch (e) { $("msg").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
  loadUsers();
}
window.saveUser = (email) => withMsg(async () => {
  const s = slug(email);
  const r = await api("/api/users", { method: "PUT", body: JSON.stringify({
    email, role: $(`r_${s}`).value, banks: checked(`b_${s}`), enabled: $(`e_${s}`).checked }) });
  return `已儲存 ${email}。${syncText(r.sync)}`;
});
window.deleteUser = (email) => withMsg(async () => {
  if (!confirm(`確定刪除 ${email}？（只想暫停可以取消「啟用」）`)) return "已取消";
  const r = await api(`/api/users/${encodeURIComponent(email)}`, { method: "DELETE" });
  return `已刪除 ${email}。${syncText(r.sync)}`;
});
window.decide = (id, approve) => withMsg(async () => {
  const r = await api(`/api/access-requests/${id}/decision`, { method: "POST", body: JSON.stringify({
    approve, role: $(`qr_${id}`).value, banks: checked(`qb_${id}`) }) });
  return `申請 #${id} 已${approve ? "核准" : "拒絕"}。${syncText(r.sync)}`;
});
window.syncNow = () => withMsg(async () => syncText(await api("/api/cf-sync", { method: "POST" })) || "同步未啟用");
$("nuBtn").onclick = () => withMsg(async () => {
  const email = $("nuEmail").value.trim();
  const r = await api("/api/users", { method: "PUT", body: JSON.stringify({
    email, role: $("nuRole").value, banks: checked("nu"), enabled: true }) });
  $("nuEmail").value = "";
  return `已新增 ${email}。${syncText(r.sync)}`;
});

async function showRequestPage(w) {
  $("requestSection").classList.remove("hidden");
  $("appBody").classList.add("hidden");
  $("who").textContent = w.email || "";
  if (w.status === "disabled") { $("reqStatus").textContent = "你的帳號已停用，請聯絡 SA。"; return; }
  if (w.pending_request) {
    const p = w.pending_request;
    $("reqStatus").textContent = `你的申請（${p.role}，${p.banks.map(id => (allBanks.find(b => b.id === id) || {}).name || id).join("、")}）已在 ${t(p.created_at)} 送出，等待 SA 審核。`;
    $("reqForm").classList.add("hidden");
    return;
  }
  $("reqStatus").textContent = `${w.email} 還沒有使用權限，請送出申請，SA 核准後就能使用。`;
  $("reqForm").classList.remove("hidden");
  $("reqRole").innerHTML = ["PM", "SE", "PG"].map(r => `<option>${r}</option>`).join("");
  $("reqBanks").innerHTML = bankChecks("req", [], false);
}
$("reqBtn").onclick = async () => {
  try {
    await api("/api/access-requests", { method: "POST", body: JSON.stringify({
      role: $("reqRole").value, banks: checked("req"), reason: $("reqReason").value }) });
    await showRequestPage(await api("/api/whoami"));
  } catch (e) { $("reqMsg").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
};

async function loadProvision() {
  if (!me.is_sa) return;
  const p = await api("/api/provision");
  $("provSection").classList.remove("hidden");
  $("provHint").textContent = p.enabled
    ? `從範本 VM 的 clean 快照複製（client 範本：${p.templates.client || "無"}，server 範本：${p.templates.server || "無"}），下一個 IP ${p.next_ip}。大約 5–15 分鐘，完成後會關機待命。`
    : "portal.toml 還沒有 [provision] 設定，請重跑 deploy.ps1 -Stage Portal。";
  const kind = $("pvKind").value;
  const cur = $("pvBank").value;
  $("pvBank").innerHTML = (kind === "client" ? `<option value="">共用（不分銀行）</option>` : "") +
    allBanks.map(b => `<option value="${esc(b.id)}">${esc(b.name)}</option>`).join("") +
    `<option value="__new">＋ 新增銀行…</option>`;
  if ([...$("pvBank").options].some(o => o.value === cur)) $("pvBank").value = cur;
  $("pvNewBank").classList.toggle("hidden", $("pvBank").value !== "__new");
  table($("pvJobs"), [
    ["#", j => j.id], ["名稱", j => esc(j.name)], ["類型", j => j.kind], ["銀行", j => esc(j.bank_name || (j.bank ? bankName(j.bank) : "共用"))],
    ["IP", j => esc(j.ip)], ["狀態", j => pill(j.status)], ["進度", j => esc(j.step || "")],
    ["備註", j => j.error ? `<span class="${j.status === "failed" ? "err" : "muted"}">${esc(j.error)}</span>` : ""],
  ], p.jobs.slice(0, 10));
  return p;
}
$("pvKind").onchange = () => loadProvision();
$("pvBank").onchange = () => $("pvNewBank").classList.toggle("hidden", $("pvBank").value !== "__new");
$("pvBtn").onclick = async () => {
  const isNew = $("pvBank").value === "__new";
  const body = {
    name: $("pvName").value.trim(), kind: $("pvKind").value,
    bank: isNew ? $("pvBankId").value.trim() : ($("pvBank").value || null),
    new_bank_name: isNew ? $("pvBankName").value.trim() : null,
    ports: $("pvPorts").value.split(/[,\s]+/).filter(Boolean).map(Number),
  };
  try {
    const j = await api("/api/provision", { method: "POST", body: JSON.stringify(body) });
    $("pvMsg").textContent = `已開始建立 ${j.name}（${j.ip}），進度看下面的表格`;
    $("pvName").value = "";
  } catch (e) { $("pvMsg").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
  loadProvision();
};

async function loadPrewarm() {
  if (!me.is_sa) return;
  const p = await api("/api/prewarm");
  $("pwEnabled").checked = p.enabled; $("pwStandby").value = p.standby_clients;
  $("pwStart").value = p.start; $("pwEnd").value = p.end; $("pwMax").value = p.max_running;
}

const pwById = {};
window.copyPw = (id) => {
  const pw = pwById[id];
  if (!pw || !navigator.clipboard) return;
  navigator.clipboard.writeText(pw).then(
    () => { $("msg").textContent = "密碼已複製，到遠端桌面登入畫面按 Ctrl+V 貼上"; },
    () => {});
};

// 先開好分頁（瀏覽器只允許在點擊當下開新分頁），等 VM 準備好再把它導到遠端桌面
function waitingTab() {
  const tab = window.open("", "_blank");
  if (!tab) return null;
  tab.document.title = "準備測試環境…";
  tab.document.body.style.cssText = "font-family:system-ui,sans-serif;padding:40px;line-height:1.7";
  tab.document.body.innerHTML = "<h2>正在準備測試環境…</h2><p id='s'>VM 沒開機的話要等 1–3 分鐘，好了會自動連線。這個分頁不要關。</p>";
  return tab;
}
// 就緒：在等待分頁顯示帳密，按按鈕複製密碼再連線（複製剪貼簿一定要使用者按一下）
function readyTab(tab, a) {
  if (!a.rdp_password) { tab.location = a.rdp_url; return; }
  tabSay(tab, `<b>${esc(a.vm)}</b> 已就緒。<br>登入帳號 <code style="font-size:1.2em">${esc(a.rdp_user || "")}</code>　` +
    `密碼 <code style="font-size:1.2em">${esc(a.rdp_password)}</code><br>` +
    `<button id="go" style="font-size:1.1em;padding:8px 16px;margin-top:12px">複製密碼並連線</button>` +
    `<br><small>到登入畫面帳號打 ${esc(a.rdp_user || "")}，密碼按 Ctrl+V。忘了的話回 Portal「我的分配」可以再複製。</small>`);
  try {
    tab.document.querySelector("h2").textContent = "測試環境已就緒";
    tab.document.getElementById("go").onclick = () => {
      const go = () => { tab.location = a.rdp_url; };
      (tab.navigator.clipboard ? tab.navigator.clipboard.writeText(a.rdp_password) : Promise.reject()).then(go, go);
    };
  } catch { tab.location = a.rdp_url; }
}
function tabSay(tab, html) { try { tab.document.getElementById("s").innerHTML = html; } catch {} }

$("wakeBtn").onclick = async () => {
  const tab = waitingTab();
  $("msg").textContent = "喚醒中…（VM 沒開機的話要等開機與健康檢查，好了會自動開啟遠端桌面）";
  try {
    let a = await api("/api/wake", { method: "POST", body: JSON.stringify({ bank: $("bank").value, kind: $("kind").value }) });
    $("msg").textContent = `已分配 ${a.vm}，等待就緒…`;
    refresh();
    const t0 = Date.now();
    while (a.status === "starting" && Date.now() - t0 < 20 * 60 * 1000) {
      tabSay(tab, `已分配 <b>${esc(a.vm)}</b>，等待開機…${a.note ? "<br><small>" + esc(a.note) + "</small>" : ""}`);
      await new Promise(r => setTimeout(r, 4000));
      a = await api(`/api/allocations/${a.id}`);
    }
    if (a.status === "ready" && a.rdp_url) {
      $("msg").textContent = `${a.vm} 已就緒。帳號密碼在「我的分配」，忘了可以回來複製`;
      if (tab && !tab.closed) readyTab(tab, a); else window.open(a.rdp_url, "_blank");
    } else {
      const why = a.status === "failed" ? `啟動失敗：${a.note || ""}` : `狀態 ${a.status}`;
      $("msg").innerHTML = `<span class="err">${esc(why)}</span>`;
      tabSay(tab, `<b style="color:#b91c1c">${esc(why)}</b><br>請回 Portal 再試一次或聯絡 SA。`);
    }
  } catch (e) {
    $("msg").innerHTML = `<span class="err">${esc(e.message)}</span>`;
    tabSay(tab, `<b style="color:#b91c1c">${esc(e.message)}</b>`);
  }
  refresh();
};
window.release = async (id) => {
  try { await api(`/api/allocations/${id}/release`, { method: "POST" }); } catch (e) { alert(e.message); }
  refresh();
};
$("extBtn").onclick = async () => {
  try {
    const r = await api("/api/extend", { method: "POST", body: JSON.stringify({ until: $("extUntil").value, reason: $("extReason").value }) });
    $("msg").textContent = `今天已延長到 ${r.until}`;
    $("extReason").value = "";
    await loadMe();
  } catch (e) { $("msg").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
};
$("pwSave").onclick = async () => {
  try {
    await api("/api/prewarm", { method: "PUT", body: JSON.stringify({
      enabled: $("pwEnabled").checked, standby_clients: +$("pwStandby").value,
      start: $("pwStart").value, end: $("pwEnd").value, max_running: +$("pwMax").value }) });
    $("msg").textContent = "預暖機設定已儲存";
  } catch (e) { $("msg").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
};
$("reconcileBtn").onclick = async () => {
  const r = await api("/api/reconcile", { method: "POST" });
  $("msg").textContent = `reconcile：預暖機 ${r.prewarmed.length} 台、自動釋放 ${r.auto_released.length} 筆`;
  refresh();
};
$("devUser").onchange = async (e) => {
  try { localStorage.setItem("devUser", e.target.value); } catch {}
  if (asParam) { location.search = ""; return; }
  start();
};

let timer = null;
async function start() {
  try {
    const w = await api("/api/whoami");
    allBanks = w.banks;
    if (w.status !== "active") { await showRequestPage(w); return; }
    $("requestSection").classList.add("hidden");
    $("appBody").classList.remove("hidden");
    await loadMe(); await loadPrewarm(); await loadProvision(); await loadUsers(); await refresh();
    if (!timer) timer = setInterval(refresh, 5000);
  } catch (e) { $("msg").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
}
start();
</script>
</body>
</html>
